<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10382a">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>말빛 · 실시간 한국어 자막</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/watch.js"></script>
</head>
<body class="watch-page">
  <main class="reader" aria-labelledby="watch-title">
    <header class="reader-header">
      <h2 id="watch-title">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M9.5 10a2.2 2.2 0 1 0 0 4m7-4a2.2 2.2 0 1 0 0 4"/></svg>
        실시간 한국어 자막
      </h2>
      <div class="size-tools" role="group" aria-label="글자 크기">
        <button id="smaller" type="button" aria-label="글자 작게">A−</button>
        <button id="larger" type="button" aria-label="글자 크게">A+</button>
      </div>
    </header>
    <div class="caption-scroll" id="caption-scroll" tabindex="0" aria-label="한국어 자막">
      <div id="empty" class="empty">
        <div class="empty-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <p id="empty-title">연결 중이에요</p>
        <p id="empty-note">연결되면 이 화면에 자막이 표시돼요.</p>
      </div>
      <div id="lines" class="lines"></div>
      <p id="draft" class="line draft" hidden></p>
    </div>
    <footer class="reader-footer">
      <span class="reader-status" id="status" role="status"><i></i><span>연결 중</span></span>
      <a id="home" class="watch-home" href="/" hidden>말빛 홈</a>
    </footer>
  </main>
  <div class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
